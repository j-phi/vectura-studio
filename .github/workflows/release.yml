name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 (full history) — several tests/unit/*.test.js RGR
      # proofs read a historical revision of a file via `git show <sha>:path`
      # (the pinned commit is always an ancestor of the checked-out ref, never
      # a foreign branch) to prove a fix's guard trips against the real
      # pre-fix tree. actions/checkout's default depth: 1 makes that sha
      # unreachable and those tests fail with a git error, not a real
      # regression (docs/3d-audit/lane-reports/CI-5-impl.md,
      # docs/3d-audit/lane-reports/CI-6-impl.md). This job runs test:unit and
      # test:integration on a tag push and shares the same exposure.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund --loglevel=error

      - name: Run tests
        run: npm run test:unit && npm run test:integration

      - name: Build distributable zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "vectura-studio-${VERSION}.zip" \
            index.html styles.css src assets patterns README.md CHANGELOG.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "vectura-studio-${VERSION}.zip" \
            --title "Vectura Studio v${VERSION}" \
            --notes "$(node scripts/extract-changelog.js $VERSION)" \
            --verify-tag
