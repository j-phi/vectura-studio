name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'

jobs:
  unit:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) — several tests/unit/*.test.js RGR
      # proofs read a historical revision of a file via `git show <sha>:path`
      # (the pinned commit is always an ancestor of the checked-out ref, never
      # a foreign branch) to prove a fix's guard trips against the real
      # pre-fix tree. actions/checkout's default depth: 1 makes that sha
      # unreachable and those tests fail with a git error, not a real
      # regression (docs/3d-audit/lane-reports/CI-5-impl.md).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run test:unit

  integration:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run test:integration

  e2e-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      # Smoke projects: desktop + touch-tablet + iPhone-mini on Chromium, plus the
      # TUX touch projects on Chromium (x7) and WebKit (x4, mandatory, TUX-061).
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # TUX-058: the full 26-state touch target audit on all 11 touch projects. The fast subset
  # already runs inside e2e-smoke (test:e2e:touch). Uploads the measured JSON so the linux
  # baseline section can be seeded from test-results/touch-target-measured-*.json.
  touch-audit-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:touch:audit:full
      - name: Upload touch audit measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: touch-audit-measured
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  visual:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run test:visual
      - name: Upload Visual Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-artifacts
          path: |
            tests/baselines
            *.diff
          if-no-files-found: ignore

  perf:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run test:perf

  coverage:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — see the `unit` job's checkout step above; this job
      # runs the exact same tests/unit/*.test.js RGR-history proofs (via
      # `tests/**/*.test.js` under coverage) and needs the same full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      # Runs through scripts/run-vitest.js, which tolerates vitest's birpc
      # "Timeout calling onTaskUpdate" RPC timeout — and ONLY that, and only when
      # zero tests failed. See the header of that script for why nothing else
      # (fork count, console volume, sharding, coverage scope, the threads pool)
      # eliminates it. A real failure still fails the job.
      - run: npm run test:coverage
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
          if-no-files-found: ignore
