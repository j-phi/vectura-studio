name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lane-plan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      lanes: ${{ steps.route.outputs.lanes }}
      risk: ${{ steps.route.outputs.risk }}
      classes: ${{ steps.route.outputs.classes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve explicit risk plan
        id: route
        run: node scripts/test-lane-router.js --base "${{ github.event.pull_request.base.sha || github.event.before }}" --head "$GITHUB_SHA" --json

  feedback:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [lane-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VECTURA_RISK_CLASSES: ${{ needs.lane-plan.outputs.classes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Start setup timing
        run: echo "VECTURA_SETUP_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npx playwright install --with-deps chromium
      - name: Record setup timing
        run: echo "VECTURA_SETUP_MS=$(( $(date +%s%3N) - VECTURA_SETUP_STARTED_MS ))" >> "$GITHUB_ENV"
      - run: npm run test:feedback
        env:
          VECTURA_LANE_METRICS_FILE: ${{ runner.temp }}/lane-metrics.jsonl
      - name: Verify bounded coverage shard and merge plumbing
        run: npm run test:coverage:probe
        timeout-minutes: 5
      - name: Upload lane timing and queue metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feedback-lane-metrics
          path: ${{ runner.temp }}/lane-metrics.jsonl
          if-no-files-found: ignore

  # Compatibility check name for existing branch protection. The full Vitest
  # inventory (including unit tests) is executed once by `coverage`.
  unit:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required check after full-scope coverage
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: test "$COVERAGE_RESULT" = success

  integration:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required check after full-scope coverage
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: test "$COVERAGE_RESULT" = success

  e2e-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      # Smoke projects are desktop + touch-tablet + iPhone-mini emulation on Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  visual:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'schedule')
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Preserve the required check after full-scope coverage
        if: github.event_name != 'schedule'
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: test "$COVERAGE_RESULT" = success
      - name: Check out scheduled visual suite
        if: github.event_name == 'schedule'
        uses: actions/checkout@v7
      - name: Set up Node for scheduled visual suite
        if: github.event_name == 'schedule'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies for scheduled visual suite
        if: github.event_name == 'schedule'
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Run scheduled visual suite
        if: github.event_name == 'schedule'
        run: npm run test:visual
      - name: Upload Visual Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-artifacts
          path: |
            tests/baselines
            *.diff
          if-no-files-found: ignore

  perf:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run test:perf

  coverage:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # fetch-depth: 0 — see the `unit` job's checkout step above; this job
      # runs the exact same tests/unit/*.test.js RGR-history proofs (via
      # `tests/**/*.test.js` under coverage) and needs the same full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Start coverage setup timing
        run: echo "VECTURA_SETUP_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund --loglevel=error
      - name: Record coverage setup timing
        run: echo "VECTURA_SETUP_MS=$(( $(date +%s%3N) - VECTURA_SETUP_STARTED_MS ))" >> "$GITHUB_ENV"
      # Runs through scripts/run-vitest.js, which tolerates vitest's birpc
      # "Timeout calling onTaskUpdate" RPC timeout — and ONLY that, and only when
      # zero tests failed. See the header of that script for why nothing else
      # (fork count, console volume, sharding, coverage scope, the threads pool)
      # eliminates it. A real failure still fails the job.
      - name: Run authoritative full-scope coverage and save per-file timings
        run: |
          set -o pipefail
          echo "VECTURA_COVERAGE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          npm run test:coverage -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/fullscope-vitest-results.json" 2>&1 | tee "$RUNNER_TEMP/fullscope-vitest.log"
      - name: Build inventory and timing profile
        if: always()
        run: |
          test -s "$RUNNER_TEMP/fullscope-vitest.log"
          test -s "$RUNNER_TEMP/fullscope-vitest-results.json"
          execution_ms=$(( $(date +%s%3N) - VECTURA_COVERAGE_STARTED_MS ))
          node scripts/test-profile.js --strict --log "$RUNNER_TEMP/fullscope-vitest.log" --results "$RUNNER_TEMP/fullscope-vitest-results.json" --output "$RUNNER_TEMP/fullscope-profile.json" \
            --runner "${{ runner.os }}-${{ runner.arch }}" --workers 2 --setup-ms "$VECTURA_SETUP_MS" --execution-ms "$execution_ms"
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload full-scope timing summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fullscope-vitest-profile
          path: ${{ runner.temp }}/fullscope-profile.json
          retention-days: 30
          if-no-files-found: ignore

  scheduled-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npx playwright install --with-deps chromium
      - run: npm run test:audit

  lane-gate:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [lane-plan, feedback, unit, integration, e2e-smoke, visual, perf, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Require expected lanes for this SHA
        env:
          VECTURA_LANE_METRICS_FILE: ${{ runner.temp }}/lane-roster-metrics.jsonl
          VECTURA_LANE_PLAN: ${{ needs.lane-plan.outputs.plan }}
          SHA: ${{ github.sha }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.e2e-smoke.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
          PERF_RESULT: ${{ needs.perf.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          FEEDBACK_RESULT: ${{ needs.feedback.result }}
        run: node scripts/test-lane-aggregate.js --sha "$SHA" --job=unit="$UNIT_RESULT" --job=integration="$INTEGRATION_RESULT" --job=e2e-smoke="$BROWSER_RESULT" --job=visual="$VISUAL_RESULT" --job=perf="$PERF_RESULT" --job=coverage="$COVERAGE_RESULT" --job=feedback="$FEEDBACK_RESULT"
      - name: Upload expected-roster evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expected-roster-metrics
          path: ${{ runner.temp }}/lane-roster-metrics.jsonl
          if-no-files-found: ignore
