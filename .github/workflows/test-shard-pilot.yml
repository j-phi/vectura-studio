name: Full-scope coverage shard pilot

on:
  workflow_dispatch:
    inputs:
      confirm_full_scope:
        description: Run the complete coverage roster in two parallel shards on the selected main SHA
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: coverage-shard-pilot-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit opt-in on the current main branch
        env:
          CONFIRM_FULL_SCOPE: ${{ inputs.confirm_full_scope }}
          REF: ${{ github.ref }}
        run: |
          test "$CONFIRM_FULL_SCOPE" = true
          test "$REF" = refs/heads/main

  shard:
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VECTURA_TEST_TIMEOUT_MS: 10800000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - name: Build deterministic same-SHA shard plan
        run: |
          echo "VECTURA_SHARD_PLAN_FILE=$RUNNER_TEMP/coverage-shard-plan.json" >> "$GITHUB_ENV"
          node scripts/test-shard-plan.js --plan-out "$RUNNER_TEMP/coverage-shard-plan.json" --sha "$GITHUB_SHA" --shards 2
      - name: Write shard provenance
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/pilot-artifact"
          node scripts/test-shard-plan.js --plan "$VECTURA_SHARD_PLAN_FILE" --metadata-out "$RUNNER_TEMP/pilot-artifact/metadata.json" \
            --shard "$SHARD_INDEX" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Run one full-scope V8 coverage shard
        id: run-tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -o pipefail
          echo "VECTURA_SHARD_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          npm run test:coverage:shard -- --config vitest.shard-pilot.config.mjs --shard="$SHARD_INDEX/2" \
            --coverage.thresholds.statements=0 --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 \
            --reporter=blob --reporter=json --outputFile.blob="$RUNNER_TEMP/pilot-artifact/blob.json" \
            --outputFile.json="$RUNNER_TEMP/pilot-shard-results.json" 2>&1 | tee "$RUNNER_TEMP/pilot-shard-console.log"
      - name: Verify exact assigned roster and write parsed shard timing summary
        if: always()
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          test -s "$RUNNER_TEMP/pilot-shard-results.json"
          node scripts/test-shard-plan.js --plan "$VECTURA_SHARD_PLAN_FILE" --verify-report \
            --shard "$SHARD_INDEX" --report "$RUNNER_TEMP/pilot-shard-results.json"
          test -s "$RUNNER_TEMP/pilot-shard-console.log"
          execution_ms=$(( $(date +%s%3N) - VECTURA_SHARD_STARTED_MS ))
          test -s "$RUNNER_TEMP/pilot-artifact/blob.json"
          node scripts/test-profile.js --log "$RUNNER_TEMP/pilot-shard-console.log" \
            --results "$RUNNER_TEMP/pilot-shard-results.json" --output "$RUNNER_TEMP/pilot-shard-profile.json" \
            --runner "${{ runner.os }}-${{ runner.arch }}" --workers 2 --execution-ms "$execution_ms"
      - name: Upload merge-only coverage blob and provenance
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/pilot-artifact
          retention-days: 1
          if-no-files-found: error
      - name: Upload parsed shard timing summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-profile-${{ matrix.shard }}
          path: ${{ runner.temp }}/pilot-shard-profile.json
          retention-days: 7
          if-no-files-found: ignore

  merge:
    needs: [guard, shard]
    if: needs.guard.result == 'success' && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VECTURA_TEST_TIMEOUT_MS: 10800000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - name: Rebuild exact deterministic plan for this SHA
        run: node scripts/test-shard-plan.js --plan-out "$RUNNER_TEMP/coverage-shard-plan.json" --sha "$GITHUB_SHA" --shards 2
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-shard-[12]
          path: ${{ runner.temp }}/coverage-shard-artifacts
          merge-multiple: false
      - name: Verify provenance and stage exactly two Vitest blob files
        run: node scripts/test-shard-plan.js --plan "$RUNNER_TEMP/coverage-shard-plan.json" --stage-blobs \
          --artifacts "$RUNNER_TEMP/coverage-shard-artifacts" --blob-dir "$RUNNER_TEMP/vitest-blobs" \
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Merge blob reports and enforce global coverage thresholds once
        run: |
          set -o pipefail
          npm run test:coverage:merge -- --config vitest.shard-pilot.config.mjs \
            --merge-reports="$RUNNER_TEMP/vitest-blobs" --coverage --coverage.reporter=json \
            --coverage.reportsDirectory="$RUNNER_TEMP/merged-coverage" --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/merged-results.json" 2>&1 | tee "$RUNNER_TEMP/merged-pilot-console.log"
      - name: Enforce merged full-scope inventory, skip baseline, and profile all file timings
        run: |
          node scripts/test-profile.js --strict --log "$RUNNER_TEMP/merged-pilot-console.log" \
            --results "$RUNNER_TEMP/merged-results.json" --output "$RUNNER_TEMP/merged-pilot-profile.json" \
            --runner "${{ runner.os }}-${{ runner.arch }}" --workers 2
      - name: Upload merged coverage JSON and parsed profile only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fullscope-shard-pilot-results
          path: |
            ${{ runner.temp }}/merged-coverage/coverage-final.json
            ${{ runner.temp }}/merged-pilot-profile.json
          retention-days: 7
          if-no-files-found: ignore
